# Pipeline DevSecOps pour E-commerce PS
stages:
  - build
  - test
  - security_scan
  - deploy

variables:
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
  GIT_DEPTH: "0"

# Stage 1 : Build
build-back:
  stage: build
  image: maven:3.9-eclipse-temurin-17
  tags:
    - maven  # Indique d'utiliser ton Runner local
  script:
    - cd back
    - mvn clean compile -DskipTests
  artifacts:
    paths:
      - back/target/

# Stage 2 : Tests Unitaires
unit-test-back:
  stage: test
  image: maven:3.9-eclipse-temurin-17
  tags:
    - maven
  script:
    - cd back
    - mvn test -Dmaven.test.failure.ignore=true  artifacts:
    reports:
      junit: back/target/surefire-reports/TEST-*.xml

# Stage 3 : Analyse SonarQube (Phase 3)
sonarqube-check:
  stage: security_scan
  image: maven:3.9-eclipse-temurin-17
  tags:
    - maven
  variables:
    # On utilise ton IP locale identifiée plus haut
    SONAR_HOST_URL: "http://192.168.100.67:9000"
  script:
    - cd back
    - mvn verify sonar:sonar -Dsonar.token=$SONAR_TOKEN
  only:
    - master
    - main

# Stage 4 : Simulation Déploiement
deploy-job:
  stage: deploy
  tags:
    - docker
  script:
    - echo "Déploiement de l'application E-commerce sur le serveur de production..."