stages:
  - build
  - test
  - security_scan
  - deploy

variables:
  # Configuration pour SonarQube
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
  GIT_DEPTH: "0"
  SONAR_HOST_URL: "http://172.17.0.1:9000"

################################
# 1. COMPILATION DU BACKEND
################################
build-back:
  stage: build
  image: maven:3.9-eclipse-temurin-17
  tags:
    - maven
  script:
    - cd back
    - mvn clean compile -DskipTests
  artifacts:
    paths:
      - back/target/

################################
# 2. TESTS UNITAIRES (AVEC MONGO)
################################
unit-test-back:
  stage: test
  image: maven:3.9-eclipse-temurin-17
  tags:
    - maven
  services:
    - name: mongo:6
      alias: mongo
  variables:
    SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/testdb
  script:
    - cd back
    - mvn test -Dmaven.test.failure.ignore=true
  artifacts:
    when: always
    reports:
      junit: back/target/surefire-reports/TEST-*.xml

################################
# 3. ANALYSE DE SÉCURITÉ SONAR (SAST)
################################
sonarqube-check:
  stage: security_scan
  image: maven:3.9-eclipse-temurin-17
  tags:
    - maven
  allow_failure: true
  script:
    - cd back
    - |
      mvn verify sonar:sonar \
        -DskipTests \
        -Dsonar.token=$SONAR_TOKEN \
        -Dsonar.host.url=$SONAR_HOST_URL \
        -Dsonar.qualitygate.wait=true \
      || echo "⚠️ Quality Gate FAILED — Pipeline continues"
  only:
    - master
    - main

################################
# 4. ANALYSE DES LIBRAIRIES (SCA)
################################
dependency-check:
  stage: security_scan
  image: maven:3.9-eclipse-temurin-17
  tags:
    - maven
  script:
    - cd back
    - mvn clean verify -DskipTests
  artifacts:
    when: always
    reports:
      dependency_scanning: back/target/dependency-check-report.gitlab.json
    paths:
      - back/target/dependency-check-report.html

zap_vulnerability_scan_debug:
  stage: security_scan
  image:
    name: ghcr.io/zaproxy/zaproxy:stable
    entrypoint: [""]  # IMPORTANT pour éviter l'entrypoint par défaut
  tags:
    - docker
  before_script:
    - mkdir -p $CI_PROJECT_DIR/security-reports
  script:
    # -------------------------------
    # 5.1 Scan Frontend (Angular)
    # -------------------------------
    - echo "=== Scan Frontend (Angular) ==="
    - /zap/zap-baseline.py \
      -t http://172.17.0.1:4200 \
      -r $CI_PROJECT_DIR/security-reports/rapport_zap_front.html \
      -J $CI_PROJECT_DIR/security-reports/rapport_zap_front.json \
      || echo "⚠️ Frontend scan finished with warnings/errors"
    - echo "--- Contenu après scan Frontend ---"
    - ls -l $CI_PROJECT_DIR/security-reports

    # -------------------------------
    # 5.2 Scan Backend (Spring Boot)
    # -------------------------------
    - echo "=== Scan Backend (Spring Boot) ==="
    - /zap/zap-api-scan.py \
      -t $CI_PROJECT_DIR/back/zap-api-plan.yaml \
      -f openapi \
      -r $CI_PROJECT_DIR/security-reports/rapport_zap_back.html \
      -J $CI_PROJECT_DIR/security-reports/rapport_zap_back.json \
      || echo "⚠️ Backend scan finished with warnings/errors"
    - echo "--- Contenu après scan Backend ---"
    - ls -l $CI_PROJECT_DIR/security-reports

  artifacts:
    when: always
    paths:
      - $CI_PROJECT_DIR/security-reports/
    reports:
      sast:
        - $CI_PROJECT_DIR/security-reports/rapport_zap_front.json
        - $CI_PROJECT_DIR/security-reports/rapport_zap_back.json
################################
# 6. DÉPLOIEMENT (SIMULATION)
################################
deploy-job:
  stage: deploy
  tags:
    - docker
  script:
    - echo "✅ Analyse de sécurité terminée. Prêt pour le déploiement de l'E-commerce PS."