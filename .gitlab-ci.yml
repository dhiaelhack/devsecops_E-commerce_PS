stages:
  - build
  - test
  - security_scan
  - deploy

variables:
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
  GIT_DEPTH: "0"

build-back:
  stage: build
  image: maven:3.9-eclipse-temurin-17
  tags:
    - maven
  script:
    - cd back
    - mvn clean compile -DskipTests
  artifacts:
    paths:
      - back/target/

unit-test-back:
  stage: test
  image: maven:3.9-eclipse-temurin-17
  tags:
    - maven
  script:
    - cd back
    - mvn test -Dmaven.test.failure.ignore=true
  artifacts:
    when: always
    reports:
      junit: back/target/surefire-reports/TEST-*.xml

sonarqube-check:
  stage: security_scan
  image: maven:3.9-eclipse-temurin-17
  tags:
    - maven
  variables:
    SONAR_HOST_URL: "http://172.17.0.1:9000"
  script:
    - cd back
    - mvn verify sonar:sonar -Dsonar.token=$SONAR_TOKEN -Dsonar.host.url=$SONAR_HOST_URL
  only:
    - master
    - main

deploy-job:
  stage: deploy
  tags:
    - docker
  script:
    - echo "Déploiement en cours..."