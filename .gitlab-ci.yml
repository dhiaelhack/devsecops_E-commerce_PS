stages:
  - build
  - test
  - security_scan
  - deploy

variables:
  # Configuration pour SonarQube
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
  GIT_DEPTH: "0"
  # IP de la passerelle Docker validée pour ton environnement Ubuntu
  SONAR_HOST_URL: "http://172.17.0.1:9000"

################################
# 1. COMPILATION DU BACKEND
################################
build-back:
  stage: build
  image: maven:3.9-eclipse-temurin-17
  tags:
    - maven
  script:
    - cd back
    - mvn clean compile -DskipTests
  artifacts:
    paths:
      - back/target/

################################
# 2. TESTS UNITAIRES (AVEC MONGO)
################################
unit-test-back:
  stage: test
  image: maven:3.9-eclipse-temurin-17
  tags:
    - maven
  services:
    - name: mongo:6
      alias: mongo
  variables:
    SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/testdb
  script:
    - cd back
    # On ignore les échecs de tests pour ne pas bloquer les scans de sécurité suivants
    - mvn test -Dmaven.test.failure.ignore=true
  artifacts:
    when: always
    reports:
      junit: back/target/surefire-reports/TEST-*.xml

################################
# 3. ANALYSE DE SÉCURITÉ SONAR (SAST)
################################
sonarqube-check:
  stage: security_scan
  image: maven:3.9-eclipse-temurin-17
  tags:
    - maven
  script:
    - cd back
    # Analyse de la qualité du code (ex: ProductListComponent)
    - mvn verify sonar:sonar -DskipTests -Dsonar.token=$SONAR_TOKEN -Dsonar.host.url=$SONAR_HOST_URL
  only:
    - master
    - main

################################
# 4. ANALYSE DES LIBRAIRIES (SCA)
################################
dependency-check:
  stage: security_scan
  image: maven:3.9-eclipse-temurin-17
  tags:
    - maven
  script:
    - cd back
    # Vérification des vulnérabilités connues dans les dépendances Maven
    - mvn clean verify -DskipTests
  artifacts:
    when: always
    reports:
      dependency_scanning: back/target/dependency-check-report.gitlab.json
    paths:
      - back/target/dependency-check-report.html

###########################################################
# 5. SÉCURITÉ DYNAMIQUE (DAST) - OWASP ZAP
###########################################################
zap_vulnerability_scan:
  stage: security_scan
  image: ghcr.io/zaproxy/zaproxy:stable
  tags:
    - docker
  before_script:
    - mkdir -p security-reports
  script:
    # 5.1 - Scan du Frontend (Angular)
    # Vérifie les en-têtes de sécurité et les failles de navigation
    - zap-baseline.py -t http://172.17.0.1:4200 -r security-reports/rapport_zap_front.html

    # 5.2 - Scan du Backend (Spring Boot) via ton Plan Automation Framework
    # Utilise ton fichier YAML pour explorer les API du port 8080
    - zap.sh -cmd -autorun zap-api-plan.yaml
  artifacts:
    when: always
    paths:
      - security-reports/
      - zap_out.json

################################
# 6. DÉPLOIEMENT (SIMULATION)
################################
deploy-job:
  stage: deploy
  tags:
    - docker
  script:
    - echo "Analyse de sécurité terminée. Prêt pour le déploiement de l'E-commerce PS."