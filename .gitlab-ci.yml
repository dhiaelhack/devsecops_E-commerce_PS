stages:
  - build
  - test
  - security_scan
  - deploy

variables:
  # Configuration pour SonarQube
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
  GIT_DEPTH: "0"
  # IP de la passerelle Docker validée pour ton environnement Ubuntu
  SONAR_HOST_URL: "http://172.17.0.1:9000"

################################
# 1. COMPILATION DU BACKEND
################################
build-back:
  stage: build
  image: maven:3.9-eclipse-temurin-17
  tags:
    - maven
  script:
    - cd back
    - mvn clean compile -DskipTests
  artifacts:
    paths:
      - back/target/

################################
# 2. TESTS UNITAIRES (AVEC MONGO)
################################
unit-test-back:
  stage: test
  image: maven:3.9-eclipse-temurin-17
  tags:
    - maven
  services:
    - name: mongo:6
      alias: mongo
  variables:
    SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/testdb
  script:
    - cd back
    # On ignore les échecs de tests pour ne pas bloquer les scans de sécurité suivants
    - mvn test -Dmaven.test.failure.ignore=true
  artifacts:
    when: always
    reports:
      junit: back/target/surefire-reports/TEST-*.xml

################################
# 3. ANALYSE DE SÉCURITÉ SONAR (SAST)
################################
sonarqube-check:
  stage: security_scan
  image: maven:3.9-eclipse-temurin-17
  tags:
    - maven
  script:
    - cd back
    # Analyse de la qualité du code (ex: ProductListComponent)
    - mvn verify sonar:sonar -DskipTests -Dsonar.token=$SONAR_TOKEN -Dsonar.host.url=$SONAR_HOST_URL
  only:
    - master
    - main

################################
# 4. ANALYSE DES LIBRAIRIES (SCA)
################################
dependency-check:
  stage: security_scan
  image: maven:3.9-eclipse-temurin-17
  tags:
    - maven
  script:
    - cd back
    # Vérification des vulnérabilités connues dans les dépendances Maven
    - mvn clean verify -DskipTests
  artifacts:
    when: always
    reports:
      dependency_scanning: back/target/dependency-check-report.gitlab.json
    paths:
      - back/target/dependency-check-report.html

###########################################################
# 5. SÉCURITÉ DYNAMIQUE (DAST) - OWASP ZAP
###########################################################
zap_vulnerability_scan:
  stage: security_scan
  image:
    name: ghcr.io/zaproxy/zaproxy:stable
    entrypoint: [""]  # permet d'exécuter directement des commandes shell
  tags:
    - docker
  before_script:
    # Crée le dossier local où les rapports seront stockés
    - mkdir -p ~/security-reports
  script:
    # -------------------------------
    # 5.1 Scan Frontend (Angular)
    # -------------------------------
    - docker run --rm \
      -v ~/security-reports:/zap/wrk \
      ghcr.io/zaproxy/zaproxy:stable \
      zap-baseline.py \
      -t http://172.17.0.1:4200 \
      -r /zap/wrk/rapport_zap_front.html \
      -J /zap/wrk/rapport_zap_front.json

    # -------------------------------
    # 5.2 Scan Backend (Spring Boot) via plan YAML
    # -------------------------------
    - docker run --rm \
      -v ~/security-reports:/zap/wrk \
      -v ~/back/zap-api-plan.yaml:/zap/wrk/zap-api-plan.yaml \
      ghcr.io/zaproxy/zaproxy:stable \
      zap.sh -cmd -autorun /zap/wrk/zap-api-plan.yaml

  artifacts:
    when: always
    paths:
      - ~/security-reports/
    reports:
      # On peut au moins récupérer le JSON frontend pour GitLab
      sast: ~/security-reports/rapport_zap_front.json

################################
# 6. DÉPLOIEMENT (SIMULATION)
################################
deploy-job:
  stage: deploy
  tags:
    - docker
  script:
    - echo "Analyse de sécurité terminée. Prêt pour le déploiement de l'E-commerce PS."