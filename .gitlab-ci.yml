stages:
  - build
  - test
  - security_scan
  - deploy

variables:
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
  GIT_DEPTH: "0"
  SONAR_HOST_URL: "http://172.17.0.1:9000"

################################
# 1. BUILD BACKEND
################################
build-back:
  stage: build
  image: maven:3.9-eclipse-temurin-17
  tags:
    - maven
  script:
    - cd back
    - mvn clean compile -DskipTests
  artifacts:
    paths:
      - back/target/

################################
# 2. UNIT TESTS (WITH MONGO)
################################
unit-test-back:
  stage: test
  image: maven:3.9-eclipse-temurin-17
  tags:
    - maven
  services:
    - name: mongo:6
      alias: mongo
  variables:
    SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/testdb
  script:
    - cd back
    - mvn test -Dmaven.test.failure.ignore=true
  artifacts:
    when: always
    reports:
      junit: back/target/surefire-reports/TEST-*.xml

################################
# 3. SONARQUBE SAST
################################
sonarqube-check:
  stage: security_scan
  image: maven:3.9-eclipse-temurin-17
  tags:
    - maven
  allow_failure: true
  script:
    - cd back
    - |
      mvn verify sonar:sonar \
        -DskipTests \
        -Dsonar.token=$SONAR_TOKEN \
        -Dsonar.host.url=$SONAR_HOST_URL \
        -Dsonar.qualitygate.wait=true \
      || echo "⚠️ Quality Gate FAILED — Pipeline continues"
  only:
    - master
    - main

################################
# 4. DEPENDENCY-CHECK (SCA)
################################
dependency-check:
  stage: security_scan
  image: maven:3.9-eclipse-temurin-17
  tags:
    - maven
  script:
    - cd back
    - mvn clean verify -DskipTests
  artifacts:
    when: always
    reports:
      dependency_scanning: back/target/dependency-check-report.gitlab.json
    paths:
      - back/target/dependency-check-report.html

################################
# 5. DAST - OWASP ZAP
################################
zap_vulnerability_scan:
  stage: security_scan
  image:
    name: ghcr.io/zaproxy/zaproxy:stable
    entrypoint: [""]
  tags:
    - docker
  before_script:
    - mkdir -p security-reports
  script:
    # -------------------------------
    # 5.1 - FRONTEND SCAN
    # -------------------------------
    - zap-baseline.py \
      -t http://172.17.0.1:4200 \
      -r security-reports/rapport_zap_front.html \
      -J security-reports/rapport_zap_front.json

    # -------------------------------
    # 5.2 - BACKEND SCAN
    # -------------------------------
    - zap-api-scan.py \
      -t back/zap-api-plan.yaml \
      -f openapi \
      -r security-reports/rapport_zap_back.html \
      -J security-reports/rapport_zap_back.json
  artifacts:
    when: always
    paths:
      - security-reports/
    reports:
      sast:
        - security-reports/rapport_zap_front.json
        - security-reports/rapport_zap_back.json

################################
# 6. DEPLOY (SIMULATION)
################################
deploy-job:
  stage: deploy
  tags:
    - docker
  script:
    - echo "✅ Analyse de sécurité terminée. Prêt pour le déploiement de l'E-commerce PS."