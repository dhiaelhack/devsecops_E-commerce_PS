<nav class="navbar navbar-expand-lg sticky-top py-2 transition-all"
     [ngClass]="isDark ? 'navbar-dark glass-nav-dark' : 'navbar-light glass-nav-light'">
  
  <div class="container">
    
    <a class="navbar-brand d-flex align-items-center gap-2 group-hover-logo" routerLink="/shop">
      <div class="logo-icon-box shadow-lg">
        <i class="bi bi-cpu-fill text-white fs-5"></i>
      </div>
      <div class="d-flex flex-column lh-1">
        <span class="fw-black text-uppercase tracking-wide">E-Store</span>
        <span class="small fw-bold text-primary animate-year">2026</span>
      </div>
    </a>

    <button class="navbar-toggler border-0 shadow-none scale-btn" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto align-items-center gap-2 gap-lg-3 mt-3 mt-lg-0">
        
        <li class="nav-item">
          <button (click)="toggleTheme()" class="btn btn-sm rounded-circle p-2 shadow-sm scale-btn" 
                  [ngClass]="isDark ? 'btn-outline-warning text-warning' : 'btn-outline-dark'">
            <i class="bi" [ngClass]="isDark ? 'bi-sun-fill' : 'bi-moon-stars-fill'"></i>
          </button>
        </li>

        <ng-container *ngIf="username; else loggedOutZone">
          
          <li class="nav-item">
            <a routerLink="/cart" class="btn btn-outline-primary rounded-pill position-relative px-3 py-1 fw-bold shadow-sm border-2 scale-btn">
              <i class="bi bi-cart3 me-1"></i> 
              <span class="d-none d-md-inline">Panier</span>
              
              <span *ngIf="cartCount > 0" 
                    class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger border border-2 badge-pulse"
                    [ngClass]="isDark ? 'border-dark' : 'border-white'">
                {{ cartCount }}
              </span>
            </a>
          </li>

          <li class="nav-item" *ngIf="userRole === 'ADMIN'">
            <a routerLink="/admin" class="btn btn-warning btn-sm rounded-pill fw-bolder px-3 py-1 shadow-sm bg-gradient text-dark scale-btn">
              <i class="bi bi-shield-check me-1"></i> Admin
            </a>
          </li>

          <li class="nav-item">
            <div class="d-flex align-items-center px-3 py-1 rounded-pill shadow-sm border profile-badge"
                 [ngClass]="isDark ? 'bg-dark border-secondary' : 'bg-white border-light'">
              <div class="avatar-circle me-2 bg-gradient bg-primary text-white">
                <i class="bi bi-person-fill"></i>
              </div>
              <span class="small fw-bold user-select-none" [ngClass]="isDark ? 'text-light' : 'text-dark'">
                {{ username }}
              </span>
            </div>
          </li>

          <li class="nav-item">
            <button (click)="onLogout()" class="btn btn-sm btn-danger rounded-circle p-2 shadow-sm scale-btn" title="Déconnexion">
              <i class="bi bi-power"></i>
            </button>
          </li>
        </ng-container>

        <ng-template #loggedOutZone>
          <li class="nav-item d-flex gap-2">
            <a routerLink="/login" class="btn btn-sm btn-outline-primary px-4 rounded-pill fw-bold scale-btn">Login</a>
            <a routerLink="/register" class="btn btn-sm btn-primary px-4 rounded-pill fw-bold shadow-lg bg-gradient scale-btn">Join</a>
          </li>
        </ng-template>

      </ul>
    </div>
  </div>
</nav>
