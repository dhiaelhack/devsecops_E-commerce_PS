<div class="card shadow-sm p-4 mb-5 bg-light">
  <h3 class="text-center mb-4">Ajouter un nouveau Laptop</h3>
  <form (submit)="saveProduct()">
    <div class="mb-3">
      <label class="form-label">Nom du produit</label>
      <input type="text" [(ngModel)]="newProduct.name" name="name" class="form-control" placeholder="Ex: MacBook Pro">
    </div>
    <div class="mb-3">
      <label class="form-label">Prix (€)</label>
      <input type="number" [(ngModel)]="newProduct.price" name="price" class="form-control">
    </div>
    <button type="submit" class="btn btn-primary w-100">Enregistrer dans MongoDB</button>
  </form>
</div>
