<div class="card shadow-sm p-4 mb-5 bg-light border-primary">
  <h3 class="text-center mb-4 text-primary">
    <i class="bi bi-plus-circle-fill me-2"></i>Ajouter un nouveau Laptop
  </h3>
  
  <form (submit)="saveProduct()">
    <div class="mb-3">
      <label class="form-label fw-bold">Nom du produit</label>
      <input type="text" [(ngModel)]="newProduct.name" name="name" 
             class="form-control" placeholder="Ex: MacBook Pro" required>
    </div>

    <div class="mb-3">
      <label class="form-label fw-bold">Prix (€)</label>
      <input type="number" [(ngModel)]="newProduct.price" name="price" 
             class="form-control" placeholder="0.00" required>
    </div>

    <div class="mb-3">
      <label class="form-label fw-bold">Image du produit (depuis votre PC)</label>
      <input type="file" (change)="onFileSelected($event)" class="form-control" accept="image/*">
      <div class="form-text">Sélectionnez une image enregistrée sur votre ordinateur.</div>
      
      <div *ngIf="isUploading" class="mt-2 text-info">
        <span class="spinner-border spinner-border-sm me-2"></span>Envoi de l'image...
      </div>
    </div>

    <button type="submit" class="btn btn-primary w-100 fw-bold shadow-sm" [disabled]="isUploading">
      <i class="bi bi-cloud-upload-fill me-2"></i>Enregistrer dans MongoDB
    </button>
  </form>
</div>
