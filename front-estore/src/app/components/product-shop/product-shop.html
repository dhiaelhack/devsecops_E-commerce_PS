<div class="container py-4">
  <h2 class="text-center mb-5 fw-bold text-uppercase" style="letter-spacing: 2px;">
    Nos Produits High-Tech
  </h2>

  <div class="row g-4">
    <div class="col-12 col-md-6 col-lg-4" *ngFor="let product of products">
      <div class="card h-100 shadow-sm border-0 transition-hover">
        <img [src]="product.imageUrl || 'https://via.placeholder.com/300x200?text=Produit'" 
             class="card-img-top p-3" 
             [alt]="product.name"
             style="height: 200px; object-fit: contain;">
        
        <div class="card-body d-flex flex-column">
          <div class="mb-2">
            <span class="badge bg-light text-dark border">{{ product.category }}</span>
          </div>
          <h5 class="card-title fw-bold">{{ product.name }}</h5>
          <p class="card-text text-muted small flex-grow-1">{{ product.description }}</p>
          
          <div class="d-flex justify-content-between align-items-center mt-3">
            <span class="h5 mb-0 text-primary fw-bold">{{ product.price }} €</span>
            <button class="btn btn-success btn-sm px-3" (click)="addToCart(product)">
              <i class="bi bi-cart-plus me-1"></i> Ajouter au panier
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
