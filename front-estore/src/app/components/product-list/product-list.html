<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold">Administration des Produits</h2>
    <span *ngIf="isAdmin()" class="badge bg-danger">Mode Administrateur</span>
  </div>

  <div *ngIf="isAdmin()" class="mb-5 p-3 border rounded bg-light shadow-sm">
    <app-add-product (productAdded)="loadProducts()"></app-add-product>
  </div>

  <div class="table-responsive bg-white shadow-sm rounded p-3">
    <table class="table table-hover align-middle">
      <thead class="table-dark">
        <tr>
          <th>Image</th>
          <th>Nom</th>
          <th>Catégorie</th>
          <th>Prix</th>
          <th *ngIf="isAdmin()" class="text-center">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let product of products">
          <td>
            <img [src]="getSafeUrl(product.imageUrl)" class="img-thumbnail" style="width: 50px; height: 50px; object-fit: cover;">
          </td>
          <td><strong>{{ product.name }}</strong></td>
          <td><span class="badge bg-secondary">{{ product.category }}</span></td>
          <td class="text-success fw-bold">{{ product.price }} €</td>
          <td *ngIf="isAdmin()" class="text-center">
            <button (click)="deleteProduct(product.id)" class="btn btn-outline-danger btn-sm">
              <i class="bi bi-trash"></i> Supprimer
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
