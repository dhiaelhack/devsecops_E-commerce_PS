<div class="container mt-4">
  <h2 class="mb-4">Espace Administration</h2>
  
  <app-add-product (productAdded)="loadProducts()"></app-add-product>
  
  <hr class="my-5">
  
  <h3 class="mb-4">Liste des produits en stock</h3>
  <div class="row">
    <div class="col-md-4" *ngFor="let product of products"> 
      <div class="card mb-4 shadow-sm border-danger">
        <div class="card-body">
          <h5 class="card-title">{{ product.name }}</h5>
          <p class="card-text">{{ product.price }} €</p>
          <button class="btn btn-danger btn-sm" (click)="deleteProduct(product.id!)">
            <i class="bi bi-trash"></i> Supprimer
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
