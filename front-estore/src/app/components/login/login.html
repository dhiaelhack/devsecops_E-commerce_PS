<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-5 card shadow-lg p-4 border-0">
      <div class="text-center mb-4">
        <i class="bi bi-person-circle text-primary" style="font-size: 3rem;"></i>
        <h3 class="text-primary mt-2">E-Commerce Login</h3>
      </div>
      
      <form (ngSubmit)="onLogin()">
        <div class="mb-3">
          <label class="form-label fw-bold"><i class="bi bi-person-fill me-2"></i>Nom d'utilisateur</label>
          <input type="text" [(ngModel)]="credentials.username" name="username" 
                 class="form-control" placeholder="Entrez votre nom" required>
        </div>

        <div class="mb-3">
          <label class="form-label fw-bold"><i class="bi bi-lock-fill me-2"></i>Mot de passe</label>
          <input type="password" [(ngModel)]="credentials.password" name="password" 
                 class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm mb-3">
          <i class="bi bi-box-arrow-in-right me-2"></i>Se connecter
        </button>

        <div class="text-center my-3">
          <hr class="text-muted">
          <span class="bg-white px-2 text-muted small">Nouveau sur E-Store 2026 ?</span>
        </div>

        <a routerLink="/register" class="btn btn-outline-success w-100 py-2 fw-bold">
          <i class="bi bi-person-plus-fill me-2"></i>Créer un compte
        </a>
      </form>
    </div>
  </div>
</div>
